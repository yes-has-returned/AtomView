<!doctype html>
<html>
    <head>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/topnavstyle.css', v='3') }}">
        <link rel="icon" type="image/png" sizes="192x192" href="{{ url_for('static', filename='icons/favicon-192x192.png') }}">
        <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">
        <link rel="apple-touch-icon" sizes="192x192" href="{{ url_for('static', filename='icons/atomview-icon-192x192.png') }}">
        <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
        <meta name="theme-color" content="#333333">
        <title>AtomView</title>
      </head>
      <body>
    <div class="topnav">
            <a href="/" class="logo">
                <img src="{{ url_for('static', filename='icons/atomview-icon-512x512.png') }}" alt="AtomView logo" id="logo-img" class="logoimg">
                <span class="logo-text">AtomView</span>
            </a>
            <a href="/">Home</a>
            <a href="/render">Renderer</a>
            
    </div>
    {% block content %}{% endblock %}
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js', { scope: '/' })
            .then(reg => {
              console.log('Service Worker registered with scope:', reg.scope);
            })
            .catch(err => {
              console.warn('Service Worker registration failed:', err);
            });
        });
      }
  </script>
  </body>
  </html>
